name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download app icon
        run: |
          Invoke-WebRequest -Uri "https://orthodoxclipper.pages.dev/icons/icon-512.png" -OutFile "icon.png"

      - name: Install dependencies
        run: npm install

      - name: Build portable Windows EXE
        run: npm run build

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: orthodoxclipper-exe
          path: dist/Orthodox-Clipper-Windows.exe
